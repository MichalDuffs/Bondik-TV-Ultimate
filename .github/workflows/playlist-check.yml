name: Bondik TV CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Bondik TV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile Python tools
        run: |
          python -m py_compile tools/checker/check_channels.py
          python -m py_compile tools/checker/bagtop.py
          python -m py_compile tools/generator/generate_playlists.py
          python -m py_compile tools/checker/process_stream_health.py
          python -m py_compile tools/updater/check_epg_sources.py
          python -m py_compile tools/updater/process_epg_health.py
          python -m py_compile tools/updater/plan_epg_maintenance.py
          python -m py_compile tools/city/validate_capability_registry.py
          python -m py_compile tools/city/validate_city_signal.py
          python -m py_compile tools/city/build_health_snapshot.py
          python -m py_compile tools/city/render_status_board.py
          python -m py_compile tools/city/build_github_service_snapshot.py
          python -m py_compile tools/city/build_archive_index.py
          python -m py_compile tools/city/event_bus.py
          python -m py_compile tools/city/command_boundary.py
          python -m py_compile tools/city/agent_safety.py
          python -m py_compile tools/city/storage_adapter.py
          python -m py_compile tools/city/media_contract.py
          python -m py_compile tools/city/device_share_adapter.py
          python -m py_compile tools/city/service_directory.py
          python -m py_compile tools/city/access_route_planner.py
          python -m py_compile tools/city/visitor_guide.py
          python -m py_compile tools/city/permit_office.py

      - name: Run automated test suite
        run: |
          python -m pytest tools/checker/tests -q

      - name: Validate Bondik City capability registry
        run: |
          python tools/city/validate_capability_registry.py

      - name: Validate Bondik City static AI signal
        run: |
          python tools/city/validate_city_signal.py

      - name: Validate Bondik City agent safety policy
        run: |
          python tools/city/agent_safety.py

      - name: Validate Bondik City storage adapter
        run: |
          python tools/city/storage_adapter.py

      - name: Validate Bondik City media contract
        run: |
          python tools/city/media_contract.py

      - name: Validate Bondik City device share adapter
        run: |
          python tools/city/device_share_adapter.py

      - name: Validate Bondik City service directory
        run: |
          python tools/city/service_directory.py

      - name: Validate Bondik City access route planner
        run: |
          python tools/city/access_route_planner.py

      - name: Validate Bondik City visitor guide
        run: |
          python tools/city/visitor_guide.py

      - name: Validate Bondik City permit office
        run: |
          python tools/city/permit_office.py

      - name: Validate channel metadata
        run: |
          python tools/checker/check_channels.py --no-network

      - name: Generate playlists
        run: |
          python tools/generator/generate_playlists.py

      - name: Verify generated playlists
        shell: bash
        run: |
          CHANGES="$(git status --porcelain --untracked-files=all -- playlists)"

          if [ -n "$CHANGES" ]; then
            echo "Generated playlists are not synchronized with channels.yaml:"
            echo "$CHANGES"
            exit 1
          fi

          echo "Bondik approved: generated playlists are synchronized."
