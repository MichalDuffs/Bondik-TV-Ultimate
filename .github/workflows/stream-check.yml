name: Bondik TV Stream Check

on:
  schedule:
    - cron: "0 4 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bondik-stream-check
  cancel-in-progress: true

jobs:
  stream-check:
    name: Check Stable Streams
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check stable streams
        shell: bash
        run: |
          {
            echo "🐾 Bondik TV Ultimate"
            echo "📺 Stream Health Report"
            echo "Run: $GITHUB_RUN_NUMBER"
            echo "Commit: $GITHUB_SHA"
            echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "============================================================"
            echo
          } | tee stream-check-report.txt

          set +e

          python tools/checker/check_channels.py \
            --status stable \
            --attempts 3 \
            --retry-delay 5 \
            2>&1 | tee -a stream-check-report.txt

          CHECK_STATUS=${PIPESTATUS[0]}

          {
            echo
            echo "============================================================"
            echo "GitHub run: $GITHUB_RUN_ID"
          } | tee -a stream-check-report.txt

          cat stream-check-report.txt >> "$GITHUB_STEP_SUMMARY"

          exit "$CHECK_STATUS"

      - name: Upload stream check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stream-check-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: stream-check-report.txt
          retention-days: 30
          if-no-files-found: error