name: Bondik TV Stream Check

on:
  schedule:
    - cron: "0 4 * * *"

  workflow_dispatch:
    inputs:
      status:
        description: "Channel status to check"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - testing
      channel_id:
        description: "Optional exact channel ID (leave empty for all)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: bondik-stream-check
  cancel-in-progress: true

jobs:
  stream-check:
    name: Check Streams
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHANNEL_STATUS: ${{ github.event_name == 'workflow_dispatch' && inputs.status || 'stable' }}
      CHANNEL_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.channel_id || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check selected streams
        shell: bash
        run: |
          {
            echo "🐾 Bondik TV Ultimate"
            echo "📺 Stream Health Report"
            echo "Status filter: $CHANNEL_STATUS"
            echo "Channel ID: ${CHANNEL_ID:-all matching status}"
            echo "Run: $GITHUB_RUN_NUMBER"
            echo "Commit: $GITHUB_SHA"
            echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "============================================================"
            echo
          } | tee stream-check-report.txt

          set +e

          CHECK_ARGS=(
            --status "$CHANNEL_STATUS"
            --attempts 3
            --retry-delay 5
          )

          if [ -n "$CHANNEL_ID" ]; then
            CHECK_ARGS+=(--channel-id "$CHANNEL_ID")
          fi

          python tools/checker/check_channels.py \
            "${CHECK_ARGS[@]}" \
            2>&1 | tee -a stream-check-report.txt

          CHECK_STATUS=${PIPESTATUS[0]}

          {
            echo
            echo "============================================================"
            echo "GitHub run: $GITHUB_RUN_ID"
          } | tee -a stream-check-report.txt

          cat stream-check-report.txt >> "$GITHUB_STEP_SUMMARY"

          exit "$CHECK_STATUS"

      - name: Process stable stream health
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.status == 'stable') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/checker/process_stream_health.py

      - name: Upload stream check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stream-check-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            stream-check-report.txt
            stream-health-state.json
          retention-days: 30
          if-no-files-found: error