name: Bondik TV Stream Check

on:
  schedule:
    - cron: "0 4 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bondik-stream-check
  cancel-in-progress: true

jobs:
  stream-check:
    name: Check Stable Streams
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check stable streams
        run: |
          python tools/checker/check_channels.py --status stable