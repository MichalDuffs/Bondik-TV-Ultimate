name: Bondik TV Stream Check

on:
  schedule:
    - cron: "0 4 * * *"

  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bondik-stream-check
  cancel-in-progress: true

jobs:
  stream-check:
    name: Check Stable Streams
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check stable streams
        shell: bash
        run: |
          {
            echo "🐾 Bondik TV Ultimate"
            echo "📺 Stream Health Report"
            echo "Run: $GITHUB_RUN_NUMBER"
            echo "Commit: $GITHUB_SHA"
            echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "============================================================"
            echo
          } | tee stream-check-report.txt

          set +e

          python tools/checker/check_channels.py \
            --status stable \
            --attempts 3 \
            --retry-delay 5 \
            2>&1 | tee -a stream-check-report.txt

          CHECK_STATUS=${PIPESTATUS[0]}

          {
            echo
            echo "============================================================"
            echo "GitHub run: $GITHUB_RUN_ID"
          } | tee -a stream-check-report.txt

          cat stream-check-report.txt >> "$GITHUB_STEP_SUMMARY"

          exit "$CHECK_STATUS"

      - name: Compare with previous stream check
        if: always()
        shell: bash
        env:
         GITHUB_TOKEN: ${{ github.token }}
        run: |
          {
            echo
            echo "============================================================"
            echo "🐾 Bondík Stream History"
          } > stream-history.txt

          grep -E '^❌ .+ \[stable\]$' stream-check-report.txt \
            | sed -E 's/^❌ (.+) \[stable\]$/\1/' \
            | sort -u > current-failed.txt || true

          curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            -o artifacts.json

          PREVIOUS_ID="$(
            jq -r \
              --argjson run "$GITHUB_RUN_ID" \
              '
                .artifacts
                | map(
                    select(
                      (.expired == false)
                      and (.workflow_run.id != $run)
                      and (.name | startswith("stream-check-"))
                    )
                  )
                | sort_by(.created_at)
                | reverse
                | first
                | .id // empty
              ' artifacts.json
          )"

          if [ -z "$PREVIOUS_ID" ]; then
            echo "ℹ️ No previous report available - baseline created." \
              | tee -a stream-history.txt

            if [ -s current-failed.txt ]; then
              sed 's/^/⚠️ New failure: /' current-failed.txt \
                | tee -a stream-history.txt
            fi

            cat stream-history.txt >> stream-check-report.txt
            cat stream-history.txt >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          mkdir -p previous-report

          curl -fsSL -L \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$PREVIOUS_ID/zip" \
            -o previous-report.zip

          unzip -q previous-report.zip \
            -d previous-report

          grep -E '^❌ .+ \[stable\]$' \
            previous-report/stream-check-report.txt \
            | sed -E 's/^❌ (.+) \[stable\]$/\1/' \
            | sort -u > previous-failed.txt || true

          comm -12 \
            current-failed.txt \
            previous-failed.txt \
            > repeated-failed.txt

          comm -23 \
            current-failed.txt \
            previous-failed.txt \
            > new-failed.txt

          comm -13 \
            current-failed.txt \
            previous-failed.txt \
            > recovered-streams.txt

          CHANGES=0

          if [ -s new-failed.txt ]; then
            sed 's/^/⚠️ New failure: /' new-failed.txt \
              | tee -a stream-history.txt
            CHANGES=1
          fi

          if [ -s repeated-failed.txt ]; then
            sed 's/^/🚨 Repeated failure: /' repeated-failed.txt \
              | tee -a stream-history.txt
            CHANGES=1
          fi

          if [ -s recovered-streams.txt ]; then
            sed 's/^/✅ Recovered since previous run: /' recovered-streams.txt \
              | tee -a stream-history.txt
            CHANGES=1
          fi

          if [ "$CHANGES" -eq 0 ]; then
            if [ ! -s current-failed.txt ]; then
              echo "🟢 No stream health changes - all streams healthy." \
                | tee -a stream-history.txt
            else
              echo "ℹ️ Stream health unchanged." \
                | tee -a stream-history.txt
            fi
          fi

          cat stream-history.txt >> stream-check-report.txt
          cat stream-history.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload stream check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stream-check-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: stream-check-report.txt
          retention-days: 30
          if-no-files-found: error