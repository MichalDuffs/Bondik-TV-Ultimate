name: Bondik TV Stream Check

on:
  schedule:
    - cron: "0 4 * * *"

  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: bondik-stream-check
  cancel-in-progress: true

jobs:
  stream-check:
    name: Check Stable Streams
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check stable streams
        shell: bash
        run: |
          {
            echo "🐾 Bondik TV Ultimate"
            echo "📺 Stream Health Report"
            echo "Run: $GITHUB_RUN_NUMBER"
            echo "Commit: $GITHUB_SHA"
            echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "============================================================"
            echo
          } | tee stream-check-report.txt

          set +e

          python tools/checker/check_channels.py \
            --status stable \
            --attempts 3 \
            --retry-delay 5 \
            2>&1 | tee -a stream-check-report.txt

          CHECK_STATUS=${PIPESTATUS[0]}

          {
            echo
            echo "============================================================"
            echo "GitHub run: $GITHUB_RUN_ID"
          } | tee -a stream-check-report.txt

          cat stream-check-report.txt >> "$GITHUB_STEP_SUMMARY"

          exit "$CHECK_STATUS"

      - name: Compare with previous stream check
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          {
            echo
            echo "============================================================"
            echo "🐾 Bondík Stream History"
          } > stream-history.txt

          grep -E '^❌ .+ \[stable\]$' stream-check-report.txt \
            | sed -E 's/^❌ (.+) \[stable\]$/\1/' \
            | sort -u > current-failed.txt || true

          curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            -o artifacts.json

          PREVIOUS_ID="$(
            jq -r \
              --argjson run "$GITHUB_RUN_ID" \
              '
                .artifacts
                | map(
                    select(
                      (.expired == false)
                      and (.workflow_run.id != $run)
                      and (.name | startswith("stream-check-"))
                    )
                  )
                | sort_by(.created_at)
                | reverse
                | first
                | .id // empty
              ' artifacts.json
          )"

          if [ -z "$PREVIOUS_ID" ]; then
            echo "ℹ️ No previous report available - baseline created." \
              | tee -a stream-history.txt

            if [ -s current-failed.txt ]; then
              sed 's/^/⚠️ New failure: /' current-failed.txt \
                | tee -a stream-history.txt
            fi

            cat stream-history.txt >> stream-check-report.txt
            cat stream-history.txt >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          mkdir -p previous-report

          curl -fsSL -L \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$PREVIOUS_ID/zip" \
            -o previous-report.zip

          unzip -q previous-report.zip \
            -d previous-report

          grep -E '^❌ .+ \[stable\]$' \
            previous-report/stream-check-report.txt \
            | sed -E 's/^❌ (.+) \[stable\]$/\1/' \
            | sort -u > previous-failed.txt || true

          comm -12 \
            current-failed.txt \
            previous-failed.txt \
            > repeated-failed.txt

          comm -23 \
            current-failed.txt \
            previous-failed.txt \
            > new-failed.txt

          comm -13 \
            current-failed.txt \
            previous-failed.txt \
            > recovered-streams.txt

          CHANGES=0

          if [ -s new-failed.txt ]; then
            sed 's/^/⚠️ New failure: /' new-failed.txt \
              | tee -a stream-history.txt
            CHANGES=1
          fi

          if [ -s repeated-failed.txt ]; then
            sed 's/^/🚨 Repeated failure: /' repeated-failed.txt \
              | tee -a stream-history.txt
            CHANGES=1
          fi

          if [ -s recovered-streams.txt ]; then
            sed 's/^/✅ Recovered since previous run: /' recovered-streams.txt \
              | tee -a stream-history.txt
            CHANGES=1
          fi

          if [ "$CHANGES" -eq 0 ]; then
            if [ ! -s current-failed.txt ]; then
              echo "🟢 No stream health changes - all streams healthy." \
                | tee -a stream-history.txt
            else
              echo "ℹ️ Stream health unchanged." \
                | tee -a stream-history.txt
            fi
          fi

          cat stream-history.txt >> stream-check-report.txt
          cat stream-history.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Manage stream health issues
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f stream-history.txt ]; then
            echo "No stream history available."
            exit 0
          fi

          sed -n \
            's/^🚨 Repeated failure: //p' \
            stream-history.txt \
            > repeated-issues.txt

          sed -n \
            's/^✅ Recovered since previous run: //p' \
            stream-history.txt \
            > recovered-issues.txt

          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"

          if [ -s repeated-issues.txt ]; then
            while IFS= read -r CHANNEL; do
              TITLE="🚨 Stream outage: $CHANNEL"

              OPEN_ISSUE="$(
                curl -fsSL \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "$API/issues?state=open&per_page=100" \
                  | jq -r \
                    --arg title "$TITLE" \
                    '
                      map(
                        select(
                          (.pull_request | not)
                          and (.title == $title)
                        )
                      )
                      | first
                      | .number // empty
                    '
              )"

              if [ -n "$OPEN_ISSUE" ]; then
                echo "Issue already open for $CHANNEL (#$OPEN_ISSUE)."
                continue
              fi

              BODY="$(
                cat <<EOF
          ## 🐾 Bondík Stream Health Alert

          The stream **$CHANNEL** failed in consecutive health checks.

          This issue was created automatically after Bondík confirmed that the failure was not just a temporary outage.

          - Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Commit: \`$GITHUB_SHA\`
          - Status: 🚨 repeated failure

          The issue will be closed automatically when the stream recovers.

          ---
          🐾 Bondik TV Ultimate
          EOF
              )"

              jq -n \
                --arg title "$TITLE" \
                --arg body "$BODY" \
                '{
                  title: $title,
                  body: $body
                }' \
                > issue.json

              curl -fsSL \
                -X POST \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$API/issues" \
                --data-binary @issue.json \
                > created-issue.json

              NUMBER="$(
                jq -r '.number' created-issue.json
              )"

              echo "Created issue #$NUMBER for $CHANNEL."
            done < repeated-issues.txt
          fi

          if [ -s recovered-issues.txt ]; then
            while IFS= read -r CHANNEL; do
              TITLE="🚨 Stream outage: $CHANNEL"

              ISSUE_NUMBER="$(
                curl -fsSL \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "$API/issues?state=open&per_page=100" \
                  | jq -r \
                    --arg title "$TITLE" \
                    '
                      map(
                        select(
                          (.pull_request | not)
                          and (.title == $title)
                        )
                      )
                      | first
                      | .number // empty
                    '
              )"

              if [ -z "$ISSUE_NUMBER" ]; then
                echo "No open issue found for recovered stream $CHANNEL."
                continue
              fi

              jq -n \
                '{
                  state: "closed",
                  state_reason: "completed"
                }' \
                > close-issue.json

              curl -fsSL \
                -X PATCH \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$API/issues/$ISSUE_NUMBER" \
                --data-binary @close-issue.json \
                > /dev/null

              echo "Closed issue #$ISSUE_NUMBER - $CHANNEL recovered."
            done < recovered-issues.txt
          fi

          if [ ! -s repeated-issues.txt ] \
            && [ ! -s recovered-issues.txt ]; then
            echo "No issue action required."
          fi

      - name: Upload stream check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stream-check-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: stream-check-report.txt
          retention-days: 30
          if-no-files-found: error