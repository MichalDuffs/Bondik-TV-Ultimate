project:
  name: "Bondik TV Ultimate"
  version: "1.0.0"
  description: "Open-source IPTV playlist project focused on quality, organization and reliability"

  language:
    default: "en"
    supported:
      - en
      - cs
      - sk

  maintainer:
    name: "Bondik TV Ultimate Team"

  mascot:
    name: "Bondík"
    role: "Chief Quality Officer"

playlist:
  format:
    type: "M3U"
    charset: "UTF-8"

  default_output: "playlists/ultimate.m3u"

  features:
    logos: true
    epg: true
    groups: true

generator:
  enabled: true

  input:
    channels: "channels/channels.yaml"

  output:
    ultimate: "playlists/ultimate.m3u"
    countries: "playlists/countries"
    categories: "playlists/categories"
    providers: "playlists/providers"

quality:
  minimum_status: "stable"

  require:
    stream_url: true
    channel_name: true
    country: true
    category: true

  recommended:
    logo: true
    epg_id: true
    provider: true