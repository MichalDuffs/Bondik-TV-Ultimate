version: 1
city:
  id: bondik-city
  status: foundation
  principle: preserve-isolate-extend

buildings:
  - id: bondik-tv
    name: Bondík-TV HQ
    status: active
    role: flagship-media-product
    capabilities:
      - playback
      - search
      - playlists
      - epg
      - favorites
      - stream-health

  - id: github-service
    name: GitHub Service
    status: active
    role: repository-evidence-gateway
    capabilities:
      - repository-metadata-read
      - default-branch-head-read
      - pull-request-read
      - issue-read
      - workflow-run-read
    constraints:
      mutation: false
      token-exposure: false

  - id: archive
    name: Archive
    status: active
    role: evidence-provenance-catalog
    capabilities:
      - evidence-availability-index
      - protocol-identification
      - sha256-provenance
    constraints:
      copy-source-content: false
      mutation: false

  - id: post-office
    name: Post Office
    status: active
    role: local-event-routing
    capabilities:
      - event-envelope-validation
      - typed-subscription
      - local-event-delivery
    constraints:
      network-transport: false
      persistent-queue: false
      command-execution: false

  - id: dispatch-office
    name: Dispatch Office
    status: active
    role: local-command-routing
    capabilities:
      - command-envelope-validation
      - explicit-command-registration
      - read-only-local-dispatch
    constraints:
      network-transport: false
      mutation: false
      agent-execution: false

  - id: radio-station
    name: Radio Station
    status: planned
    role: ai-city-beacon
    audience:
      - ai-agents
    capabilities:
      - city-discovery
      - protocol-announcement
      - capability-advertisement
      - approved-event-broadcast
      - cooperation-handshake
    constraints:
      uncontrolled-command-channel: false
      expose-sensitive-state: false
      execution-requires-capability-permission: true

infrastructure:
  - id: archive-evidence-index
    status: active
    purpose: read-only-evidence-provenance-catalog
  - id: github-evidence-gateway
    status: active
    purpose: bounded-read-only-repository-evidence
  - id: session
    status: active
    purpose: versioned-user-and-product-state
  - id: capability-registry
    status: active
    purpose: human-and-agent-readable-capabilities
  - id: media-contract
    status: planned
    purpose: reusable-media-source-boundary
  - id: command-boundary
    status: active
    purpose: decouple-ui-from-actions
  - id: event-boundary
    status: active
    purpose: observable-module-events
  - id: storage-adapter
    status: planned
    purpose: platform-independent-persistence-boundary
  - id: device-share-adapter
    status: planned
    purpose: future-share-to-tv-and-device-targets
  - id: agent-safety-envelope
    status: planned
    purpose: bounded-ai-access-to-project-capabilities
  - id: agent-signal-protocol
    status: active
    purpose: machine-readable-discovery-and-approved-inter-agent-signals

virtual_areas:
  - id: garden
    status: concept
    maps_to: calm-overview-dashboard
  - id: pool
    status: concept
    maps_to: runtime-data-flow-visualization
  - id: party-zone
    status: concept
    maps_to: demo-and-showcase-surface
  - id: control-tower
    status: active
    maps_to: ci-qc-health-review
  - id: archive
    status: active
    maps_to: artifacts-history-backups

rules:
  delete_working_foundations: false
  installer_before_product_stability: false
  core_vip_paywall: false
  human_readable: true
  agent_readable: true
