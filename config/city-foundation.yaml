version: 1
city:
  id: bondik-city
  status: foundation
  principle: preserve-isolate-extend

buildings:
  - id: bondik-tv
    name: Bondík-TV HQ
    status: active
    role: flagship-media-product
    capabilities:
      - playback
      - search
      - playlists
      - epg
      - favorites
      - stream-health

  - id: github-service
    name: GitHub Service
    status: active
    role: repository-evidence-gateway
    capabilities:
      - repository-metadata-read
      - default-branch-head-read
      - pull-request-read
      - issue-read
      - workflow-run-read
    constraints:
      mutation: false
      token-exposure: false

  - id: archive
    name: Archive
    status: active
    role: evidence-provenance-catalog
    capabilities:
      - evidence-availability-index
      - protocol-identification
      - sha256-provenance
    constraints:
      copy-source-content: false
      mutation: false

  - id: post-office
    name: Post Office
    status: active
    role: local-event-routing
    capabilities:
      - event-envelope-validation
      - typed-subscription
      - local-event-delivery
    constraints:
      network-transport: false
      persistent-queue: false
      command-execution: false

  - id: dispatch-office
    name: Dispatch Office
    status: active
    role: local-command-routing
    capabilities:
      - command-envelope-validation
      - explicit-command-registration
      - read-only-local-dispatch
    constraints:
      network-transport: false
      mutation: false
      agent-execution: false

  - id: gatehouse
    name: Gatehouse
    status: active
    role: agent-permission-boundary
    capabilities:
      - default-deny-policy
      - role-access-evaluation
      - capability-access-evaluation
    constraints:
      command-authority: false
      mutation-authority: false
      network-authority: false
      handoff-authority: false

  - id: storage-hub
    name: Storage Hub
    status: active
    role: local-persistence-boundary
    capabilities:
      - namespaced-json-storage
      - monotonic-record-revisions
      - expected-revision-conflict-detection
      - local-file-reference-adapter
    constraints:
      network-storage: false
      agent-execution: false
      implicit-platform-migration: false

  - id: media-gateway
    name: Media Gateway
    status: active
    role: reusable-media-source-boundary
    capabilities:
      - catalog-channel-resolution
      - media-source-envelope
      - stream-header-preservation
      - catalog-provenance
    constraints:
      player-control: false
      stream-rewrite: false
      agent-execution: false

  - id: device-dock
    name: Device Dock
    status: active
    role: prepare-only-device-handoff
    capabilities:
      - android-tv-target-envelope
      - media-source-handoff-preparation
      - logical-target-validation
    constraints:
      device-discovery: false
      network-transport: false
      playback-execution: false
      agent-execution: false

  - id: directory-office
    name: Directory Office
    status: active
    role: descriptive-city-topology
    capabilities:
      - location-index
      - capability-to-location-map
      - virtual-area-map
    constraints:
      execution: false
      mutation: false
      network: false

  - id: navigator-office
    name: Navigator Office
    status: active
    role: permission-aware-route-planning
    capabilities:
      - capability-location-resolution
      - gatehouse-decision-projection
      - non-executing-access-route-plan
    constraints:
      permission-grant: false
      execution: false
      mutation: false
      network: false

  - id: visitor-center
    name: Visitor Center
    status: active
    role: permission-aware-city-guide
    capabilities:
      - allowed-capability-guide
      - denied-capability-explanation
      - location-aware-access-advice
    constraints:
      permission-grant: false
      execution: false
      mutation: false
      network: false

  - id: permit-office
    name: Permit Office
    status: active
    role: human-review-request-boundary
    capabilities:
      - high-impact-request-ticket
      - current-policy-snapshot
      - human-review-placeholder
    constraints:
      auto-approval: false
      permission-grant: false
      execution: false
      mutation: false
      network: false

  - id: review-board
    name: Review Board
    status: active
    role: human-review-record-boundary
    capabilities:
      - human-decision-record
      - permit-evidence-preservation
      - non-granting-review-outcome
    constraints:
      permission-grant: false
      policy-change: false
      execution: false
      mutation: false
      network: false

  - id: audit-office
    name: Audit Office
    status: active
    role: human-review-evidence-ledger
    capabilities:
      - permit-review-linkage
      - sha256-evidence-digests
      - create-once-review-record
    constraints:
      overwrite: false
      delete-through-wrapper: false
      permission-grant: false
      policy-change: false
      execution: false
      network: false

  - id: seal-office
    name: Seal Office
    status: active
    role: inactive-approval-certificate-issuer
    capabilities:
      - approved-review-seal
      - exact-scope-certificate
      - audit-evidence-binding
    constraints:
      runtime-authority: false
      permission-grant: false
      policy-activation: false
      execution: false
      mutation: false
      network: false

  - id: key-vault
    name: Key Vault
    status: active
    role: inactive-certificate-registry
    capabilities:
      - create-once-certificate-registration
      - certificate-digest-preservation
      - inactive-certificate-readout
    constraints:
      activation: false
      overwrite: false
      delete-through-wrapper: false
      runtime-authority: false
      permission-grant: false
      policy-activation: false
      execution: false
      network: false

  - id: ignition-office
    name: Ignition Office
    status: active
    role: human-activation-intent-boundary
    capabilities:
      - inactive-key-intent
      - exact-scope-human-intent
      - vault-evidence-verification
    constraints:
      activation: false
      runtime-authority: false
      permission-grant: false
      policy-activation: false
      execution: false
      mutation: false
      network: false

  - id: key-turn-office
    name: Key Turn Office
    status: active
    role: human-activation-confirmation-boundary
    capabilities:
      - exact-intent-human-confirmation
      - intent-digest-binding
      - confirmed-not-active-record
    constraints:
      activation: false
      runtime-authority: false
      permission-grant: false
      policy-activation: false
      execution: false
      mutation: false
      network: false

  - id: grant-office
    name: Grant Office
    status: active
    role: human-confirmed-runtime-grant-issuer
    capabilities:
      - exact-scope-runtime-grant
      - human-confirmation-binding
      - single-use-local-grant-token
    constraints:
      consumer-connected: false
      single-use: true
      local-only: true
      policy-mutation: false
      execution: false
      network: false

  - id: starter-gate
    name: Starter Gate
    status: active
    role: runtime-grant-admission-boundary
    capabilities:
      - exact-capability-owner-resolution
      - non-consuming-grant-admission
      - grant-evidence-binding
    constraints:
      consumer-connected: false
      grant-consumption: false
      command-dispatch: false
      execution: false
      policy-mutation: false
      network: false

  - id: radio-station
    name: Radio Station
    status: active
    role: ai-city-beacon
    audience:
      - ai-agents
    capabilities:
      - city-discovery
      - protocol-announcement
      - capability-advertisement
      - static-agent-signal
    constraints:
      network-broadcast: false
      approved-event-broadcast: false
      cooperation-handshake: false
      uncontrolled-command-channel: false
      expose-sensitive-state: false
      execution-requires-capability-permission: true

infrastructure:
  - id: archive-evidence-index
    status: active
    purpose: read-only-evidence-provenance-catalog
  - id: github-evidence-gateway
    status: active
    purpose: bounded-read-only-repository-evidence
  - id: session
    status: active
    purpose: versioned-user-and-product-state
  - id: capability-registry
    status: active
    purpose: human-and-agent-readable-capabilities
  - id: media-contract
    status: active
    purpose: reusable-media-source-boundary
  - id: command-boundary
    status: active
    purpose: decouple-ui-from-actions
  - id: event-boundary
    status: active
    purpose: observable-module-events
  - id: storage-adapter
    status: active
    purpose: platform-independent-persistence-boundary
  - id: device-share-adapter
    status: active
    purpose: future-share-to-tv-and-device-targets
  - id: agent-safety-envelope
    status: active
    purpose: bounded-ai-access-to-project-capabilities
  - id: agent-signal-protocol
    status: active
    purpose: machine-readable-discovery-and-approved-inter-agent-signals
  - id: service-directory
    status: active
    purpose: descriptive-city-topology-and-capability-location-map
  - id: access-route-planner
    status: active
    purpose: combine-location-and-gatehouse-decision-without-execution
  - id: visitor-guide
    status: active
    purpose: permission-aware-capability-guide-without-granting-authority
  - id: permit-office
    status: active
    purpose: prepare-human-review-tickets-without-granting-permission
  - id: human-review-record
    status: active
    purpose: record-human-review-without-applying-runtime-authority
  - id: human-review-audit-ledger
    status: active
    purpose: create-once-auditable-permit-review-evidence
  - id: inactive-approval-certificate
    status: active
    purpose: seal-approved-audit-evidence-without-runtime-authority
  - id: inactive-certificate-registry
    status: active
    purpose: create-once-registration-of-sealed-inactive-certificates
  - id: activation-intent
    status: active
    purpose: prepare-human-activation-intent-without-runtime-authority
  - id: activation-confirmation
    status: active
    purpose: record-explicit-human-confirmation-without-activation
  - id: runtime-grant
    status: active
    purpose: issue-exact-scope-human-confirmed-grants-without-consumer-execution
  - id: grant-admission
    status: active
    purpose: validate-runtime-grant-against-exact-local-capability-owner

virtual_areas:
  - id: garden
    status: concept
    maps_to: calm-overview-dashboard
  - id: pool
    status: concept
    maps_to: runtime-data-flow-visualization
  - id: party-zone
    status: concept
    maps_to: demo-and-showcase-surface
  - id: control-tower
    status: active
    maps_to: ci-qc-health-review
  - id: archive
    status: active
    maps_to: artifacts-history-backups

rules:
  delete_working_foundations: false
  installer_before_product_stability: false
  core_vip_paywall: false
  human_readable: true
  agent_readable: true
